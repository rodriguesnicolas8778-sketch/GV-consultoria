<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2A1F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golden Vision">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Golden Vision · Plataforma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* mostra na tela qualquer erro, para facilitar o suporte */
(function(){
  function mostrar(t){
    var f = function(){ var b = document.getElementById("erroBox"); if (!b){ b = document.createElement("div"); b.id = "erroBox"; b.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#B4372B;color:#fff;padding:12px 14px;border-radius:10px;font:13px/1.45 Consolas,monospace;white-space:pre-wrap;max-height:45vh;overflow:auto;box-shadow:0 10px 30px rgba(0,0,0,.35)"; b.textContent = "Erro na plataforma (mande um print disto para o suporte):\n"; document.body.appendChild(b); } b.textContent += "\n\u2022 " + t; };
    if (document.body) f(); else document.addEventListener("DOMContentLoaded", f);
  }
  window.addEventListener("error", function(e){ mostrar((e.message || "erro") + (e.lineno ? "  [linha " + e.lineno + ", coluna " + e.colno + "]" : "")); });
  window.addEventListener("unhandledrejection", function(e){ var r = e.reason || {}; mostrar("Promessa: " + (r.message || r.code || r)); });
})();
</script>
<style>
:root{
  --brand:#1E5A8A;
  --bg:#F2F4F3; --surface:#FFFFFF; --paper:#F6F8F7; --ink:#16201C; --muted:#5F6A66; --line:#E3E7E5;
  --def:#B5530A; --def-soft:#FBEBDD; --par:#C98A1E; --ok:#2E7A4E; --ok-soft:#DFEFE5; --acao:#2F5FA8; --acao-soft:#E2EAF7; --red:#B4372B; --red-soft:#F8E1DD;
  --brand-soft:color-mix(in srgb, var(--brand) 11%, var(--surface));
  --brand-ink:color-mix(in srgb, var(--brand) 85%, #000);
  --gvc:#9C7A2B;
  --side:color-mix(in srgb, var(--gvc) 22%, #0D1210);
  --heat:var(--brand);
  --shadow:0 1px 2px rgba(22,32,28,.04), 0 8px 24px -16px rgba(22,32,28,.22);
  --ff-h:"Plus Jakarta Sans",Inter,system-ui,sans-serif; --ff:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121615; --surface:#1A1F1D; --paper:#161A19; --ink:#E9EDEB; --muted:#A0AAA6; --line:#2B3230;
    --def:#EDA864; --def-soft:#3A2A19; --par:#E3B465; --ok:#7CC79A; --ok-soft:#1D3327; --acao:#86AEEB; --acao-soft:#1D2A3D; --red:#EE8A7D; --red-soft:#3A201C;
    --brand-soft:color-mix(in srgb, var(--brand) 26%, var(--surface));
    --brand-ink:color-mix(in srgb, var(--brand) 45%, #fff); --heat:color-mix(in srgb, var(--brand) 50%, #fff);
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1A1F1D; --paper:#161A19; --ink:#E9EDEB; --muted:#A0AAA6; --line:#2B3230;
  --def:#EDA864; --def-soft:#3A2A19; --par:#E3B465; --ok:#7CC79A; --ok-soft:#1D3327; --acao:#86AEEB; --acao-soft:#1D2A3D; --red:#EE8A7D; --red-soft:#3A201C;
  --brand-soft:color-mix(in srgb, var(--brand) 26%, var(--surface));
  --brand-ink:color-mix(in srgb, var(--brand) 45%, #fff); --heat:color-mix(in srgb, var(--brand) 50%, #fff);
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 12px 28px -18px rgba(0,0,0,.7); color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--ff);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--ff-h);font-weight:600;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
img{max-width:100%}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--side) 248px,transparent 248px)}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;padding:22px 14px 18px;background:var(--side);color:#fff;overflow-y:auto}
.brand{display:flex;align-items:center;gap:11px;padding:6px;border:0;background:none;text-align:left;border-radius:14px;color:#fff}
.brand:hover{background:rgba(255,255,255,.06)}
.logo{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:var(--brand);color:#fff;font:800 16px/1 var(--ff-h);letter-spacing:.01em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.logo.img{background:#fff;border:1px solid var(--line)}
.logo img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font:700 15.5px/1.2 var(--ff-h)}
.brand small{display:block;font-size:12px;color:rgba(255,255,255,.55);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11.5px;color:rgba(255,255,255,.38);padding:14px 12px 6px;font-weight:500}
.nav button{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:10px;color:rgba(255,255,255,.66);font-weight:500}
.nav button .l{display:flex;align-items:center;gap:11px;min-width:0}
.nav button .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav svg{width:18px;height:18px;flex:none}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button[aria-current="page"]{background:rgba(255,255,255,.11);color:#fff;font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#fff}
.nav .add{color:rgba(255,255,255,.55);font-weight:500;border:1px dashed rgba(255,255,255,.18);margin-top:8px}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#F0A04B;color:#20140a;font-size:11.5px;font-weight:700;display:inline-grid;place-items:center;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.save{display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.6);padding:0 8px}
.save i{width:8px;height:8px;border-radius:50%;background:#5FD08F;flex:none;box-shadow:0 0 0 3px rgba(95,208,143,.15)}
.save.busy i{background:#F0A04B;animation:pulse 1s infinite}
.save.err i{background:#F07B6B}
.save.err{color:#F7A99E}
@keyframes pulse{50%{opacity:.35}}
.linkbtn{border:0;background:none;padding:5px 8px;color:rgba(255,255,255,.62);text-align:left;font-size:13px;border-radius:8px}
.who{font-size:11.5px;color:rgba(255,255,255,.42);padding:2px 8px}
.linkbtn:hover{color:#fff;background:rgba(255,255,255,.06)}
main{padding:28px clamp(16px,3.2vw,44px) 72px;min-width:0;max-width:1240px;width:100%}

/* topo */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:22px}
.top h1{font-size:clamp(24px,2.8vw,32px);line-height:1.12;font-weight:800;letter-spacing:-.025em}
.top p{margin:5px 0 0;color:var(--muted);max-width:64ch}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--paper)}
.btn.danger{color:var(--red)}
.btn.sm{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
.pad{padding:18px 20px}

/* abas internas (RH) */
.subtabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:18px}
.subtabs button{border:0;background:none;padding:8px 16px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--brand);color:#fff}

/* composer */
.composer{padding:16px 18px;display:grid;gap:12px;margin-bottom:22px}
.composer textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);line-height:1.5}
.composer textarea:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.crow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tipos{display:flex;flex-wrap:wrap;gap:6px}
.tipo{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.tipo[aria-pressed="true"][data-t="def"]{background:var(--def-soft);border-color:var(--def);color:var(--def)}
.tipo[aria-pressed="true"][data-t="pos"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.tipo[aria-pressed="true"][data-t="acao"]{background:var(--acao-soft);border-color:var(--acao);color:var(--acao)}
.tipo[aria-pressed="true"][data-t="nota"]{background:var(--paper);border-color:var(--muted);color:var(--ink)}
.cright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:38px;padding:0 10px}
.hint{font-size:12px;color:var(--muted)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters .search{flex:1 1 200px;max-width:320px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip .n{opacity:.7;font-weight:500;margin-left:4px}

/* diário */
.day{margin:0 0 18px}
.day h3{font:600 13px/1 var(--ff);color:var(--muted);margin:0 0 8px 2px;display:flex;gap:8px;align-items:baseline}
.day h3 b{color:var(--ink);font-weight:600}
.entries{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.entry{display:grid;grid-template-columns:6px 1fr;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry .bar{background:var(--line)}
.entry[data-t="def"] .bar{background:var(--def)}
.entry[data-t="pos"] .bar{background:var(--ok)}
.entry[data-t="acao"] .bar{background:var(--acao)}
.entry .body{padding:12px 16px;min-width:0}
.entry .txt{white-space:pre-wrap;word-wrap:break-word}
.entry.done .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;background:var(--paper)}
.tag.def{background:var(--def-soft);color:var(--def)}
.tag.pos{background:var(--ok-soft);color:var(--ok)}
.tag.acao{background:var(--acao-soft);color:var(--acao)}
.tag.ar{background:var(--brand-soft);color:var(--brand-ink)}
.status{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:500}
.status[data-s="pendente"]{color:var(--def);border-color:color-mix(in srgb,var(--def) 45%,var(--line))}
.status[data-s="andamento"]{color:var(--acao);border-color:color-mix(in srgb,var(--acao) 45%,var(--line))}
.status[data-s="resolvido"]{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.meta .sp{flex:1}
.mini{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 4px;border-radius:5px;text-decoration:underline;text-underline-offset:2px}
.mini:hover{color:var(--ink)}
.mini.del:hover{color:var(--red)}
.edit textarea{width:100%;min-height:80px;border:1px solid var(--brand);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical}
.edit .crow{margin-top:8px}

.empty{padding:34px 22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--paper)}
.empty b{display:block;color:var(--ink);font:600 16px/1.3 var(--ff-h);margin-bottom:4px}

/* painel */
.dash{display:grid;gap:20px}
.banner{position:relative;overflow:hidden;border-radius:24px;padding:26px 28px;background:var(--brand);color:#fff;display:grid;grid-template-columns:auto 1fr;gap:18px 22px;align-items:center;box-shadow:0 18px 40px -24px color-mix(in srgb,var(--brand) 80%,#000)}
.banner::after{content:"";position:absolute;right:-80px;top:-120px;width:340px;height:340px;border-radius:50%;border:56px solid rgba(255,255,255,.06);pointer-events:none}
.banner .logo{width:68px;height:68px;border-radius:18px;font-size:24px;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.banner .logo.img{background:#fff}
.banner .hi{font-size:13.5px;color:rgba(255,255,255,.75)}
.banner h1{font-size:clamp(25px,3.2vw,36px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin-top:2px}
.banner .sub{color:rgba(255,255,255,.75);font-size:14px;margin-top:3px}
.kp{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:6px;border-top:1px solid rgba(255,255,255,.16);padding-top:18px;position:relative}
.kp div{padding:0 18px;border-left:1px solid rgba(255,255,255,.16)}
.kp div:first-child{padding-left:0;border-left:0}
.kp b{display:block;font:800 30px/1 var(--ff-h);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.kp b small{font-size:16px;font-weight:700;opacity:.8;margin-left:1px}
.kp span{display:block;font-size:12.5px;color:rgba(255,255,255,.72);margin-top:6px}

.quick{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 10px 10px 12px;border-radius:18px}
.quick select,.quick input{border:0;background:var(--paper);border-radius:12px;min-height:44px;padding:0 14px}
.qarea{display:flex;align-items:center;gap:2px;background:var(--paper);border-radius:12px;padding-left:12px}
.qarea span{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.qarea select{background:transparent!important;font-weight:600;color:var(--brand-ink);cursor:pointer}
.quick input{background:transparent;font-size:15px;min-width:0}
.quick input:focus{outline:none}
.quick:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 14%,transparent)}
.quick .tsel{display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:12px}
.quick .tsel button{border:0;background:none;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.quick .tsel button[aria-pressed="true"][data-t="def"]{background:var(--def-soft);color:var(--def)}
.quick .tsel button[aria-pressed="true"][data-t="pos"]{background:var(--ok-soft);color:var(--ok)}
.quick .tsel button[aria-pressed="true"][data-t="acao"]{background:var(--acao-soft);color:var(--acao)}
.quick .tsel button[aria-pressed="true"][data-t="nota"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.quick .btn.primary{min-height:44px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 12px}
.sec-h h2{font-size:16.5px;font-weight:700;letter-spacing:-.015em}
.sec-h span,.sec-h button{font-size:13px;color:var(--muted)}
.sec-h button{border:0;background:none;padding:0}
.sec-h button:hover{color:var(--ink)}

.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:14px;text-align:left;padding:18px;border-radius:20px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);transition:border-color .15s, transform .15s}
.acard:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));transform:translateY(-1px)}
.acard .hd{display:flex;align-items:center;gap:10px;font:700 15px/1.2 var(--ff-h)}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-ink);flex:none}
.ic svg{width:18px;height:18px}
.acard .hd .an{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .hd .fx{flex:none;margin-left:auto;font:500 12px var(--ff);color:var(--muted)}
.acard .big{display:flex;align-items:baseline;gap:8px}
.acard .big b{font:800 32px/1 var(--ff-h);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.acard .big b.z{color:var(--muted);opacity:.55}
.acard .big span{font-size:13px;color:var(--muted)}
.prog{height:6px;border-radius:6px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.acard .pl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:-6px}
.acard .last{font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.9em}

.g-2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.heat{padding:20px 22px}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px}
.hm i{aspect-ratio:1;border-radius:4px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line)}
.hm i[data-l="1"]{background:color-mix(in srgb,var(--heat) 25%,var(--surface));box-shadow:none}
.hm i[data-l="2"]{background:color-mix(in srgb,var(--heat) 50%,var(--surface));box-shadow:none}
.hm i[data-l="3"]{background:color-mix(in srgb,var(--heat) 75%,var(--surface));box-shadow:none}
.hm i[data-l="4"]{background:var(--heat);box-shadow:none}
.hm i.fut{visibility:hidden}
.hm i.today{outline:2px solid var(--ink);outline-offset:1px}
.hm-f{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:4px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}

.sw4{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.sw4 button{position:relative;overflow:hidden;border:0;border-radius:14px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:96px}
.sw4 .l{font:700 13.5px var(--ff-h)}
.sw4 .n{font:800 28px/1 var(--ff-h);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sw4 .x{position:absolute;right:10px;top:4px;font:800 54px/1 var(--ff-h);opacity:.13}
.sw4 [data-q="f"]{background:var(--ok-soft);color:var(--ok)}
.sw4 [data-q="w"]{background:var(--def-soft);color:var(--def)}

const fmtDia = s => {
  const d = parseD(s); if (!d) return s;
  const t = parseD(hoje()), diff = Math.round((t - d) / 864e5);
  const longo = d.toLocaleDateString("pt-BR", {weekday:"long", day:"2-digit", month:"long"}) + (d.getFullYear() !== t.getFullYear() ? " de " + d.getFullYear() : "");
  return {rot: diff === 0 ? "Hoje" : diff === 1 ? "Ontem" : longo.charAt(0).toUpperCase() + longo.slice(1), sub: diff <= 1 ? longo : ""};
};

const lsGet = k => { try { return localStorage.getItem(k) || sessionStorage.getItem(k) || ""; } catch(e){ return ""; } };
let SERVIDOR = lsGet(LS_SRV) || SERVIDOR_PADRAO;

function guardarSessao(token, lembrar){
  TOKEN = token || "";
  try { localStorage.removeItem(LS_TOK); sessionStorage.removeItem(LS_TOK); if (token) (lembrar ? localStorage : sessionStorage).setItem(LS_TOK, token); } catch(e){}
}
async function api(fn, args){
  if (!SERVIDOR) throw {code:"SEM_SERVIDOR", message:"Informe o endereço do servidor."};
  let r;
  try { r = await fetch(SERVIDOR, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({fn, args}), redirect:"follow"}); }
  catch(e){ throw {code:"REDE", message:"Sem conexão com o servidor. Confira a internet e o endereço /exec."}; }
  let j; try { j = await r.json(); } catch(e){ throw {code:"RESPOSTA", message:"O servidor respondeu de um jeito inesperado. Confira se o endereço termina em /exec e se a implantação está como \"Qualquer pessoa\"."}; }
  if (!j.ok){
    const m = String(j.err || ""), i = m.indexOf("|");
    const err = i > 0 && i < 30 ? {code:m.slice(0, i).trim(), message:m.slice(i + 1)} : {code:"erro", message:m};
    if (err.code === "SESSAO") sessaoExpirou(err.message);
    throw err;
  }
  return j.r;
}
const gas = (fn, ...args) => api(fn, [TOKEN].concat(args));
const temGAS = () => !!(SERVIDOR && TOKEN);
function sessaoExpirou(msg){
  guardarSessao("");

}
const nomeUser = em => { const u = USUARIOS.find(x => x.email === String(em || "").toLowerCase()); return u ? u.nome : String(em || "").split("@")[0]; };
const keepDoc = (k, v) => !!v && (k === "gv" || k === "config" || k === "relatorio" || k.startsWith("diag_") || k.startsWith("doc_") || Object.keys(v.items || {}).length > 0);
function rotulosDiag(k){
  if (!k.startsWith("diag_")) return null;
  const id = k.slice(5), m = MODELOS[id] || {}, campos = {}, itens = {};
  (m.campos || []).forEach(f => campos[f.k] = f.l); checkItems(id).forEach(i => itens[i.k] = i.l);
  return {campos, itens};
}
function enfileirar(dk, job){
  dirty.set(dk, (dirty.get(dk) || 0) + 1); pend++; setSave("busy", "Salvando…");
  const fim = () => { pend = Math.max(0, pend - 1); dirty.set(dk, Math.max(0, (dirty.get(dk) || 1) - 1)); };
  chains[dk] = (chains[dk] || Promise.resolve()).then(async () => {
    try { await job(); }
    catch(e){ if (e && (e.code === "OCUPADO" || e.code === "erro")){ await new Promise(r => setTimeout(r, 1500 + Math.random() * 1500)); await job(); } else throw e; }
  }).catch(e => { fim(); setSave("err", e && e.code === "SEM_ACESSO" ? e.message : "Não salvou na planilha. Verifique a internet e tente de novo."); return "erro"; })
    .then(r => { if (r === "erro") return; fim(); if (!pend) setSave("ok", savedLabel()); });
  return chains[dk];
}
function writeScoped(sc, k, silent){
  const D = dataOf(sc);
  if (!keepDoc(k, D[k])) delete D[k];
  if (!silent) requestRender();
  if (sc !== "g" && sc === CUR) agendarResumo();
  const rot = sc === CUR ? rotulosDiag(k) : null;
  return enfileirar(sc + "|" + k, async () => {
    const body = dataOf(sc)[k];
    const r = await gas("salvar", sc, k, body ? clone(body) : null, rot);
    if (r && r.textoId && dataOf(sc)[k]) dataOf(sc)[k].textoId = r.textoId;
  });
}
function writeItem(sc, k, id, silent){
  const D = dataOf(sc);
  if (D[k] && !keepDoc(k, D[k]) && k !== "clientes") delete D[k];
  if (!silent) requestRender();
  if (sc !== "g" && sc === CUR) agendarResumo();
  return enfileirar(sc + "|" + k + "|" + id, async () => {
    const v = dataOf(sc)[k] && dataOf(sc)[k].items && dataOf(sc)[k].items[id];
    await gas("salvarItem", sc, k, id, v ? clone(v) : null);
  });
}
const writeKey = (k, silent) => CUR && writeScoped(CUR, k, silent);
const writeG = (k, silent) => writeScoped("g", k, silent);
function putItem(k, id, data){ B[k] = B[k] || {items:{}}; B[k].items = Object.assign({}, B[k].items, {[id]: data}); writeItem(CUR, k, id); }
function delItem(k, id){ if (!B[k]) return; const it = Object.assign({}, B[k].items); delete it[id]; B[k].items = it; writeItem(CUR, k, id); }
function setCfg(patch){ B.config = Object.assign({}, B.config || {}, patch); applyBrand(); writeKey("config"); }
function putCliente(id, patch, silent){
  G.clientes = G.clientes || {items:{}};
  const atual = G.clientes.items[id] || {};
  G.clientes.items = Object.assign({}, G.clientes.items, {[id]: Object.assign({}, atual, patch, {atualizado:new Date().toISOString(), atualizado_por:USER.email})}); writeItem("g", "clientes", id, silent);
}
function setGV(patch){ G.gv = Object.assign(gvCfg(), patch); applyBrand(); writeG("gv"); }

/* mescla o que veio da planilha com o que ainda está sendo salvo */
function mesclar(sc, novo){
  const D = dataOf(sc);
  for (const [dk, n] of dirty){
    if (!(n > 0) || !dk.startsWith(sc + "|")) continue;
    const partes = dk.slice(sc.length + 1).split("|"), k = partes[0];
    if (partes.length === 1){ if (D[k]) novo[k] = D[k]; else delete novo[k]; }
    else { const id = partes[1]; novo[k] = novo[k] || {items:{}}; const v = D[k] && D[k].items && D[k].items[id]; novo[k].items = Object.assign({}, novo[k].items); if (v) novo[k].items[id] = v; else delete novo[k].items[id]; }
  }
  if (sc !== "g") Object.keys(D).forEach(k => { if (k.startsWith("doc_") && D[k].texto && novo[k] && novo[k].textoId === D[k].textoId) novo[k].texto = D[k].texto; });
  return novo;
}

let tResumo = null;

function calcResumo(){
  const obs = allObs(), c = cfg(), ps = c.abas.map(a => scoreOf(a.id).pct).filter(p => p != null);
  return {pend:obs.filter(pendente).length, adeq:ps.length ? Math.round(ps.reduce((t, x) => t + x, 0) / ps.length) : null, ultima:obs[0] ? obs[0].data : "", nobs:obs.length, func:Object.keys(itemsOf("func")).length};
}
function salvarResumo(){
  if (!CUR || !clientes()[CUR] || ui.carregandoCli) return;
  const r = calcResumo(), old = clientes()[CUR].resumo || {};

}

async function entrar(ev){

const ehConstrucao = () => /constru/i.test(cfg().segmento || "");

const RESP = {sim:"Sim", parcial:"Parcial", nao:"Não", na:"N/A"};
const diagOf = id => B["diag_" + id] || {dados:{}, check:{}, extras:{}};
function checkItems(id){
  const m = MODELOS[id], d = diagOf(id);
  const cc = ehConstrucao();
  return (m ? m.check.filter(x => !x[3] || (x[3] === 1) === cc).map(([k, l, g]) => ({k, l, g})) : []).concat(Object.entries(d.extras || {}).sort((a, b) => (a[1].criado || "").localeCompare(b[1].criado || "")).map(([k, x]) => ({k, l:x.l, g:m ? "Itens adicionados" : "Itens de verificação", extra:true})));
}
function scoreOf(id){
  const its = checkItems(id), ch = diagOf(id).check || {}, c = {sim:0, parcial:0, nao:0, na:0, vazio:0};
  its.forEach(i => { const r = ch[i.k] && ch[i.k].r; c[r || "vazio"]++; });
  const n = c.sim + c.parcial + c.nao;
  return Object.assign(c, {total:its.length, pct:n ? Math.round((c.sim + c.parcial * .5) / n * 100) : null});
}
function setDiag(id, fn, silent){ const k = "diag_" + id, d = clone(diagOf(id)); d.dados = d.dados || {}; d.check = d.check || {}; d.extras = d.extras || {}; fn(d); d.atualizado = new Date().toISOString(); B[k] = d; writeKey(k, silent); }
const fmtMoneyIn = v => v == null || v === "" ? "" : (+v).toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});

function calcHTML(id){
  const m = MODELOS[id]; if (!m || !m.calc) return "";
  const out = m.calc(diagOf(id).dados || {});
  return out.length ? out.map(([l, v]) => `<span>${esc(l)}: <b class="num">${esc(v)}</b></span>`).join("") : `<span class="mt">Preencha os números para ver os indicadores.</span>`;
}
function diagHTML(a){
  const id = a.id, m = MODELOS[id], d = diagOf(id), dd = d.dados || {}, ch = d.check || {}, sc = scoreOf(id);
  const pctBar = k => sc.total ? (sc[k] / sc.total * 100).toFixed(2) : 0;
  const campo = f => {
    const v = dd[f.k], at = `data-diag="${esc(id)}" data-df="${f.k}"`;
    let inp;
    if (f.t === "sel") inp = `<select class="field" ${at}><option value="">Não informado</option>${f.o.map(o => `<option${v === o ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else if (f.t === "area") inp = `<textarea ${at} placeholder="${esc(f.ph || "")}">${esc(v || "")}</textarea>`;
    else if (f.t === "money") inp = `<span class="money"><span>R$</span><input class="field num" inputmode="decimal" data-money="1" ${at} value="${esc(fmtMoneyIn(v))}" placeholder="0,00"></span>`;
    else if (f.t === "num") inp = `<input class="field num" type="number" min="0" inputmode="numeric" ${at} value="${esc(v == null ? "" : v)}">`;
    else inp = `<input class="field" ${at} value="${esc(v || "")}" placeholder="${esc(f.ph || "")}" autocomplete="off">`;
    return `<label class="lbl${f.t === "area" ? " wide" : ""}">${esc(f.l)}${inp}</label>`;
  };
  const grupos = []; checkItems(id).forEach(i => { let g = grupos.find(x => x.g === i.g); if (!g){ g = {g:i.g, its:[]}; grupos.push(g); } g.its.push(i); });
  const linha = i => {
    const c = ch[i.k] || {}, r = c.r || "";
    const reg = c.obs && findObs(c.obs);
    return `<div class="ck" data-r="${r}">
      <div class="ck-l"><span class="t">${esc(i.l)}</span>
        <input class="ck-n" data-diag="${esc(id)}" data-cn="${esc(i.k)}" value="${esc(c.nota || "")}" placeholder="Observação sobre este ponto" aria-label="Observação: ${esc(i.l)}"></div>
      <div class="seg" role="group" aria-label="${esc(i.l)}">${Object.entries(RESP).map(([v, t]) => `<button type="button" data-v="${v}" data-ck="${esc(i.k)}" aria-pressed="${r === v}">${t}</button>`).join("")}</div>
      ${(r === "nao" || r === "parcial" || i.extra) ? `<div class="ex">${r === "nao" || r === "parcial" ? (reg ? `<span>Registrada no diário como deficiência</span>` : `<button type="button" class="mini" data-act="ckDef" data-ck="${esc(i.k)}">Registrar como deficiência</button>`) : ""}${i.extra ? `<button type="button" class="mini del" data-act="ckDel" data-ck="${esc(i.k)}">Remover item</button>` : ""}</div>` : ""}
    </div>`;
  };
  return `<div class="diag">
    <section class="card score">
      <div><div class="pc${sc.pct == null ? " z" : ""}">${sc.pct == null ? "–" : sc.pct}<small>${sc.pct == null ? "" : "%"}</small></div><div class="hint">adequação da área</div></div>
      <div>
        <div class="sbar" aria-hidden="true"><i class="s" style="width:${pctBar("sim")}%"></i><i class="p" style="width:${pctBar("parcial")}%"></i><i class="n" style="width:${pctBar("nao")}%"></i><i class="a" style="width:${pctBar("na")}%"></i></div>
        <div class="slg"><span><i class="s"></i>${sc.sim} sim</span><span><i class="p"></i>${sc.parcial} parcial</span><span><i class="n"></i>${sc.nao} não</span><span><i class="a"></i>${sc.na} não se aplica</span><span>${sc.vazio} sem resposta</span></div>
      </div>
    </section>
    ${m ? `<section class="card dcard"><div class="sec-h"><h2>Dados da área</h2><span>salva ao sair do campo</span></div>
      <div class="dgrid">${camposOf(id).map(campo).join("")}</div>
      ${m.calc ? `<div class="calc" id="calc">${calcHTML(id)}</div>` : ""}</section>` : ""}
    <section class="card dcard"><div class="sec-h"><h2>Checklist de verificação</h2><span>${sc.total - sc.vazio} de ${sc.total} respondidos</span></div>
      ${grupos.length ? grupos.map(g => `<div class="ckg"><h3>${esc(g.g)}</h3>${g.its.map(linha).join("")}</div>`).join("") : `<p class="hint" style="margin:0 0 12px">Adicione os pontos que você quer verificar nesta área.</p>`}
      <div class="qadd" style="margin-top:14px"><input class="field" id="ckNovo" placeholder="Adicionar item de verificação" aria-label="Novo item de verificação"><button class="btn" type="button" data-act="ckAdd">Adicionar</button></div>
    </section>
  </div>`;
}

function streak(obs){
  const dias = new Set(obs.map(o => o.data)); const d = new Date(); let n = 0;
  if (!dias.has(ymd(d))) d.setDate(d.getDate() - 1);
  while (dias.has(ymd(d))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function addObs(){
  const ta = $("#cmp"); if (!ta) return;
  const sec = ta.dataset.sec, texto = ta.value.trim();
  if (!texto){ ta.focus(); toast("Escreva a anotação antes de registrar."); return; }
  const data = ($("#cmpData") && $("#cmpData").value) || hoje();
  const tipo = ui.tipo[sec] || "def";
  const o = {secao:sec, data, texto, tipo, criado:new Date().toISOString(), autor:USER.email};
  if (tipo === "def" || tipo === "acao") o.status = "pendente";
  ui.draft[sec] = ""; ta.value = "";
  putItem(obsKey(o), uid(), o);
  toast("Anotação registrada.");
  setTimeout(() => { const t = $("#cmp"); t && t.focus(); }, 0);
}
const findObs = id => allObs().find(o => o.id === id);
function updObs(id, patch){
  const o = findObs(id); if (!o) return;
  const oldK = o._k, n = Object.assign({}, o, patch); delete n.id; delete n._k;
  if ((n.tipo === "def" || n.tipo === "acao") && !n.status) n.status = "pendente";
  n.atualizado = new Date().toISOString();
  if (n.status === "resolvido" && o.status !== "resolvido") n.resolvidoEm = hoje();
  if (n.status !== "resolvido") delete n.resolvidoEm;
  const newK = obsKey(n);
  if (newK !== oldK) delItem(oldK, id);
  putItem(newK, id, n);
}

const COR_ST = {ok:"#2E7A4E", atencao:"#C98A1E", critico:"#B4372B", neutro:"#5F6A66", vazio:"#C9D0CD"};
function fmtCurto(ind, v){
  if (v == null || isNaN(v)) return "–";
  const a = Math.abs(v), s = n => (+n).toLocaleString("pt-BR", {maximumFractionDigits:1});
  const n = a >= 1e6 ? s(v / 1e6) + " mi" : a >= 1e4 ? s(v / 1e3) + " mil" : (+v).toLocaleString("pt-BR", {maximumFractionDigits:a < 10 ? 2 : 0});
  return ind.unidade === "brl" ? "R$ " + n : ind.unidade === "pct" ? n + "%" : n;
}
function escala(mn, mx, n){
  if (mn === mx){ mx = mn + 1; }
  const bruto = (mx - mn) / n, p = Math.pow(10, Math.floor(Math.log10(bruto))), f = bruto / p, passo = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
  const a = Math.floor(mn / passo) * passo, b = Math.ceil(mx / passo) * passo, t = [];
  for (let v = a; v <= b + passo / 2; v += passo) t.push(Math.round(v * 1e6) / 1e6);
  return {mn:a, mx:b, ticks:t};
}

/* ================= fechamento do mês e evolução ================= */
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mesNome = m => { const [y, mm] = String(m).split("-"); return MESES[+mm - 1] + " de " + y; };
const mesCurto = m => { const [y, mm] = String(m).split("-"); return MESES[+mm - 1].slice(0, 3) + "/" + y.slice(2); };
const mesAtual = () => hoje().slice(0, 7);
const mesAnterior = m => { const [y, mm] = m.split("-").map(Number), d = new Date(y, mm - 2, 1); return d.getFullYear() + "-" + pad2(d.getMonth() + 1); };
const ultimoDia = m => { const [y, mm] = m.split("-").map(Number); return ymd(new Date(y, mm, 0)); };
const fechamentos = () => Object.values(itemsOf("fechamentos")).filter(f => f && f.mes).sort((a, b) => a.mes.localeCompare(b.mes));
const CORES_AREA = ["#1E5A8A","#C8561B","#2E7D5B","#8C2F39","#B8860B","#5B4B8A","#3A7C8C","#3A4750"];
const fmtInd = (n, f) => n == null || isNaN(n) ? "–" : f === "brl" ? brl(n) : f === "pct" ? Math.round(n) + "%" : (+n).toLocaleString("pt-BR", {maximumFractionDigits:1});

function fotoDoMes(mes, comentario){

    areas[a.id] = {nome:a.nome, pct:s.pct, sim:s.sim, parcial:s.parcial, nao:s.nao, na:s.na, vazio:s.vazio, pend:l.filter(pendente).length,
      novas:l.filter(o => o.data >= ini && o.data <= fim).length, resolvidas:l.filter(o => o.status === "resolvido" && (o.resolvidoEm || "") >= ini && (o.resolvidoEm || "") <= fim).length};
    dados[a.id] = clone(d.dados || {});
    check[a.id] = {}; checkItems(a.id).forEach(i => { const r = (d.check || {})[i.k]; if (r && r.r) check[a.id][i.k] = {r:r.r, l:i.l}; });

      if (m.calc) m.calc(dados[a.id]).forEach(x => { if (x[2] != null && isFinite(x[2])) lst.push({l:x[0], n:x[2], f:x[3] || "num"}); });

}

/* gráficos em SVG (funcionam na tela e no PDF) */
function grafLinhas(labels, series, o = {}){
  series = series.filter(s2 => s2.pts.some(v => v != null));
  const W = 640, H = 230, L = 40, R = 26, T = 14, Bt = 30, max = o.max || Math.max(1, ...series.flatMap(s => s.pts.filter(v => v != null)));
  const x = i => labels.length < 2 ? (L + W - R) / 2 : L + i * (W - L - R) / (labels.length - 1), y = v => T + (H - T - Bt) * (1 - v / max);
  const grid = [0, .25, .5, .75, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#E3E7E5"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end" font-size="10" fill="#7A8480">${Math.round(max * f)}${o.suf || ""}</text>`).join("");
  const xs = labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#5F6A66">${esc(l)}</text>`).join("");
  const lines = series.map(s => { const pts = s.pts.map((v, i) => v == null ? null : [x(i), y(v)]); const segs = []; let cur = []; pts.forEach(p => { if (p) cur.push(p); else if (cur.length){ segs.push(cur); cur = []; } }); if (cur.length) segs.push(cur);
    return segs.map(sg => `<polyline fill="none" stroke="${s.cor}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${sg.map(p => p.join(",")).join(" ")}"/>`).join("") + pts.filter(Boolean).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${s.cor}" stroke="#fff" stroke-width="1.5"/>`).join(""); }).join("");
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.titulo || "Gráfico")}">${grid}${xs}${lines}</svg><div class="leg">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("")}</div></div>`;
}
function grafBarras(labels, series, o = {}){
  const W = 640, H = 220, L = 34, R = 10, T = 14, Bt = 30, max = Math.max(1, ...series.flatMap(s => s.pts.map(v => v || 0)));
  const gw = (W - L - R) / Math.max(labels.length, 1), bw = Math.min(26, (gw - 14) / series.length), y = v => T + (H - T - Bt) * (1 - v / max);
  const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="#E3E7E5"/><text x="${L - 6}" y="${y(max * f) + 4}" text-anchor="end" font-size="10" fill="#7A8480">${Math.round(max * f)}</text>`).join("");
  const bars = labels.map((l, i) => { const x0 = L + i * gw + (gw - bw * series.length) / 2;
    return series.map((s, j) => { const v = s.pts[i] || 0; return `<rect x="${x0 + j * bw}" y="${y(v)}" width="${bw - 3}" height="${H - Bt - y(v)}" rx="3" fill="${s.cor}"/>${v ? `<text x="${x0 + j * bw + (bw - 3) / 2}" y="${y(v) - 4}" text-anchor="middle" font-size="10" fill="#3D4744">${v}</text>` : ""}`; }).join("") + `<text x="${L + i * gw + gw / 2}" y="${H - 10}" text-anchor="middle" font-size="10.5" fill="#5F6A66">${esc(l)}</text>`; }).join("");
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.titulo || "Gráfico")}">${grid}${bars}</svg><div class="leg">${series.map(s => `<span><i style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("")}</div></div>`;
}
function mudancasChecklist(ant, ult){
  const out = [];
  Object.keys(ult.check || {}).forEach(a => Object.entries(ult.check[a]).forEach(([k, v]) => {
    const p = ((ant.check || {})[a] || {})[k];
    if (!p || p.r !== v.r) out.push({area:(ult.areas[a] || {}).nome || a, l:v.l, de:p ? p.r : "", para:v.r});
  }));
  const peso = {sim:3, parcial:2, nao:1, na:0, "":0};
  return out.sort((x, y) => (peso[y.para] - peso[y.de]) - (peso[x.para] - peso[x.de]));
}
const respTxt = r => r ? RESP[r] : "Sem resposta";
function deltaHTML(a, b, o = {}){

}
function serieAdequacao(fs){

}
function tabelaIndicadores(fs){

  fs.forEach(f => Object.entries(f.ind || {}).forEach(([a, lst]) => lst.forEach(i => { const key = a + "|" + i.l; if (!linhas.find(x => x.key === key)) linhas.push({key, area:(f.areas[a] || {}).nome || a, l:i.l, f:i.f}); })));

}

    if (lines.every(isLi)) return (/^\s*\d/.test(lines[0]) ? "<ol>" : "<ul>") + lines.map(l => `<li>${inl(stripLi(l))}</li>`).join("") + (/^\s*\d/.test(lines[0]) ? "</ol>" : "</ul>");
    const i = lines.findIndex(isLi);
    if (i > 0) return `<p>${lines.slice(0, i).map(inl).join("<br>")}</p>` + blk(lines.slice(i));
    return `<p>${lines.map(inl).join("<br>")}</p>`;
  };
  return String(t || "").trim().split(/\n\s*\n/).map(b => blk(b.split("\n").filter(l => l.trim()))).join("");
}

function buildReport(r){
  const c = cfg(), rc = relCfg(), cor = c.cor || CFG0.cor;
  const areas = c.abas.filter(a => !r.areas || r.areas.includes(a.id));
  const [ini, fim] = rangeOf(r), per = perLabel([ini, fim]);
  const inP = d => (!ini || d >= ini) && (!fim || d <= fim);
  const aIds = new Set(areas.map(a => a.id));
  const obs = allObs().filter(o => aIds.has(o.secao));
  const obsP = obs.filter(o => inP(o.data));
  const lv = p => p == null ? "nd" : p >= 70 ? "ok" : p >= 40 ? "md" : "lo";
  const barCor = p => p == null ? "#C9D0CD" : p >= 70 ? "#2E7A4E" : p >= 40 ? "#C98A1E" : "#B4372B";
  const logo = c.logo ? `<div class="rlg"><img src="${esc(c.logo)}" alt=""></div>` : `<div class="rlg">${esc(initials(c.nome))}</div>`;
  const hojeF = fmtD(hoje());
  const titulo = REL_TIPOS[r.tipo].t;
  const gv = gvCfg(), gvNome = [gv.nome, gv.sub].filter(Boolean).join(" ");
  const gvLogo = gv.logo ? `<img class="gvl" src="${esc(gv.logo)}" alt="">` : `<img class="gvlw" src="${GV_LOGO_ESCURO}" alt="Golden Vision">`;
  const nomeA = id => (abaById(id) || {nome:"—"}).nome;

  const cover = () => `<section class="cover">
    <div><div class="ctop">${logo}<img class="cgv" src="${esc(gv.logo || GV_LOGO_ESCURO)}" alt="Golden Vision"></div><div class="tt"><div class="k">Relatório de consultoria empresarial · ${esc(gvNome)}</div><h1>${esc(titulo)}</h1><div class="emp">${esc(c.nome)}</div><div class="bar"></div>
    <dl><dt>Período</dt><dd>${esc(per)}</dd><dt>Áreas</dt><dd>${areas.length === c.abas.length ? "Todas" : esc(areas.map(a => a.nome).join(", "))}</dd>${rc.consultor ? `<dt>Consultor</dt><dd>${esc(rc.consultor)}</dd>` : ""}<dt>Emitido em</dt><dd>${hojeF}</dd></dl></div></div>
    <div class="ft"><span class="gvsig">${gvLogo}<span>Elaborado por <b>${esc(gvNome)}</b></span></span><span>Documento confidencial</span></div></section>`;
  const head = () => `<div class="head">${logo}<div><h1>${esc(titulo)}</h1><p>${esc(c.nome)} · ${esc(per)} · emitido em ${hojeF}</p><p>${esc(gvNome)}${rc.consultor ? " · " + esc(rc.consultor) : ""}</p></div></div>`;

  const scores = areas.map(a => ({a, s:scoreOf(a.id)}));
  const comNota = scores.filter(x => x.s.pct != null);
  const media = comNota.length ? Math.round(comNota.reduce((t, x) => t + x.s.pct, 0) / comNota.length) : null;
  const rastreio = obs.filter(o => o.tipo === "def" || o.tipo === "acao");
  const abertas = rastreio.filter(o => o.status !== "resolvido").length;
  const resolvidasPct = rastreio.length ? Math.round((rastreio.length - abertas) / rastreio.length * 100) : null;

  const resumo = () => `<h2>Resumo</h2>
    <div class="kpis">
      <div class="kpi"><b>${media == null ? "–" : media + "%"}</b><span>adequação média</span></div>
      <div class="kpi"><b>${abertas}</b><span>pendências abertas</span></div>
      <div class="kpi"><b>${resolvidasPct == null ? "–" : resolvidasPct + "%"}</b><span>das pendências resolvidas</span></div>
      <div class="kpi"><b>${obsP.length}</b><span>anotações no período</span></div>
    </div>
    <h3>Adequação por área (checklist)</h3>
    <div class="bars">${scores.map(({a, s}) => `<div class="br av"><span>${esc(a.nome)}</span><span class="tr"><i style="width:${s.pct || 0}%;background:${barCor(s.pct)}"></i></span><b>${s.pct == null ? "–" : s.pct + "%"}</b></div>`).join("")}</div>`;

  const parecer = () => rc.parecer && rc.parecer.trim() ? `<h2>Parecer do consultor</h2><div class="parecer">${mdLite(rc.parecer)}</div>` : "";

  const dadosArea = a => {
    const m = MODELOS[a.id]; if (!m) return "";
    const dd = diagOf(a.id).dados || {}, fs = m.campos.filter(f => dd[f.k] != null && dd[f.k] !== "");
    if (!fs.length) return "";
    const curto = fs.filter(f => f.t !== "area"), longo = fs.filter(f => f.t === "area");
    const calc = m.calc ? m.calc(dd) : [];
    return `<h3>Dados levantados</h3><div class="kv">${curto.map(f => `<div><span>${esc(f.l)}</span><b>${f.t === "money" ? brl(dd[f.k]) : esc(String(dd[f.k]))}</b></div>`).join("")}</div>
      ${longo.map(f => `<p><b>${esc(f.l)}:</b> ${esc(dd[f.k]).replace(/\n/g, "<br>")}</p>`).join("")}
      ${calc.length ? `<div class="rcalc">${calc.map(([l, v]) => `<span>${esc(l)}: <b>${esc(v)}</b></span>`).join("")}</div>` : ""}`;
  };
  const checkArea = a => {
    const ch = diagOf(a.id).check || {}, its = checkItems(a.id), s = scoreOf(a.id);
    const prob = its.filter(i => ch[i.k] && (ch[i.k].r === "nao" || ch[i.k].r === "parcial"));
    const ok = its.filter(i => ch[i.k] && ch[i.k].r === "sim");
    if (!prob.length && !ok.length) return `<h3>Checklist</h3><p class="vz">Checklist ainda não respondido.</p>`;
    return `<h3>Checklist · ${s.sim} atendem, ${s.parcial} em parte, ${s.nao} não atendem${s.vazio ? `, ${s.vazio} sem resposta` : ""}</h3>
      ${prob.length ? `<table><thead><tr><th>Ponto verificado</th><th>Resultado</th><th>Observação</th></tr></thead><tbody>${prob.sort((x, y) => (ch[x.k].r === "nao" ? 0 : 1) - (ch[y.k].r === "nao" ? 0 : 1)).map(i => `<tr><td>${esc(i.l)}</td><td class="r r-${ch[i.k].r}">${ch[i.k].r === "nao" ? "Não atende" : "Em parte"}</td><td>${esc(ch[i.k].nota || "")}</td></tr>`).join("")}</tbody></table>` : ""}
      ${ok.length ? `<p class="atende"><b>Atende:</b> ${ok.map(i => esc(i.l) + (ch[i.k].nota ? ` (${esc(ch[i.k].nota)})` : "")).join("; ")}.</p>` : ""}`;
  };
  const obsLi = (o, comArea) => `<li class="${esc(o.tipo)} av">${esc(o.texto).replace(/\n/g, "<br>")}<span class="m">${comArea ? esc(nomeA(o.secao)) + " · " : ""}${fmtD(o.data)} · ${TIPOS[o.tipo]}${o.status ? " · " + STATUS[o.status] : ""}</span></li>`;
  const obsArea = a => {
    const l = obsP.filter(o => o.secao === a.id);
    if (!l.length) return `<h3>Anotações${ini || fim ? " do período" : ""}</h3><p class="vz">Nenhuma anotação${ini || fim ? " no período" : ""}.</p>`;
    const ord = ["def", "acao", "pos", "nota"];
    return `<h3>Anotações${ini || fim ? " do período" : ""} (${l.length})</h3><ul class="obs">${l.slice().sort((x, y) => ord.indexOf(x.tipo) - ord.indexOf(y.tipo) || (y.data || "").localeCompare(x.data || "")).map(o => obsLi(o)).join("")}</ul>`;
  };
  const funcArea = () => {
    const f = Object.values(itemsOf("func")).sort((a, b) => (a.nome || "").localeCompare(b.nome || "", "pt-BR"));
    if (!f.length) return "";
    return `<h3>Equipe cadastrada (${f.length})</h3><table><thead><tr><th>Nome</th><th>Função</th><th>Setor</th><th>Vínculo</th><th>Admissão</th><th>Observações</th></tr></thead><tbody>${f.map(x => `<tr><td>${esc(x.nome)}</td><td>${esc(x.cargo || "")}</td><td>${esc(x.setor || "")}</td><td>${esc(x.vinculo || "")}</td><td>${fmtD(x.admissao)}</td><td>${esc(x.obs || "").replace(/\n/g, "<br>")}</td></tr>`).join("")}</tbody></table>`;
  };
  const swotSec = () => {
    const sw = Object.values(itemsOf("swot")).sort((a, b) => (a.criado || "").localeCompare(b.criado || ""));
    const q = k => `<div class="q ${k} av"><h3>${QUADS[k].nome}</h3>${sw.filter(i => i.quad === k).length ? `<ul>${sw.filter(i => i.quad === k).map(i => `<li>${esc(i.texto)}</li>`).join("")}</ul>` : `<p class="vz">Nenhum item.</p>`}</div>`;
    return `<h2>Análise SWOT</h2><p>Forças e fraquezas são internas à empresa; oportunidades e ameaças vêm do ambiente externo.</p><div class="sw">${q("f")}${q("w")}${q("o")}${q("t")}</div>`;
  };
  const docsSec = () => {
    const ds = docsOf().filter(d => aIds.has(d.area) && (inP((d.criado || "").slice(0, 10)) || (d.competencia && inP(d.competencia + "-15"))));
    if (!ds.length) return "";
    return `<div class="pb"></div><h2>Documentos recebidos</h2><table><thead><tr><th>Documento</th><th>Tipo</th><th>Área</th><th>Referência</th><th>Recebido</th></tr></thead><tbody>${ds.map(d => `<tr class="av"><td>${esc(d.nome)}${d.notas ? `<small>${esc(d.notas).replace(/\n/g, "<br>")}</small>` : ""}</td><td>${esc((DOC_TIPOS[d.tipo] || DOC_TIPOS.outro).t)}</td><td>${esc(nomeA(d.area))}</td><td>${d.competencia ? esc(mesCurto(d.competencia)) : "–"}</td><td>${fmtD((d.criado || "").slice(0, 10))}</td></tr>`).join("")}</tbody></table>`;
  };
  const planoSec = (comTitulo) => {
    const pend = obs.filter(pendente).sort((a, b) => (a.data || "").localeCompare(b.data || ""));
    const ligados = new Set(pend.map(o => o.id));
    const doCheck = [];
    areas.forEach(a => { const ch = diagOf(a.id).check || {}; checkItems(a.id).forEach(i => { const c2 = ch[i.k]; if (c2 && (c2.r === "nao" || c2.r === "parcial") && !(c2.obs && findObs(c2.obs))) doCheck.push({a, i, c:c2}); }); });
    const idade = d => { const n = Math.round((parseD(hoje()) - parseD(d)) / 864e5); return n <= 0 ? "hoje" : n + " d"; };
    let n = 0;
    const rows = pend.map(o => `<tr class="av"><td>${++n}</td><td>${esc(nomeA(o.secao))}</td><td>${esc(o.texto).replace(/\n/g, "<br>")}</td><td>${o.tipo === "def" ? "Corrigir" : "Implantar"}</td><td>${fmtD(o.data)} <span style="color:#8A948F">(${idade(o.data)})</span></td><td>${STATUS[o.status || "pendente"]}${o.proxima ? `<small>Próxima: ${esc(o.proxima)}</small>` : ""}</td><td>${esc(o.responsavel || "")}</td><td>${o.prazo ? fmtD(o.prazo) + (o.prazo < hoje() ? `<small style="color:#B4372B">atrasada</small>` : "") : ""}</td></tr>`).join("")
      + doCheck.map(x => `<tr class="av"><td>${++n}</td><td>${esc(x.a.nome)}</td><td>${esc(x.i.l)}${x.c.nota ? `<br><span style="color:#5F6A66">${esc(x.c.nota)}</span>` : ""}</td><td>${x.c.r === "nao" ? "Implantar" : "Completar"}</td><td>Checklist</td><td>Pendente</td><td class="blank"></td><td class="blank"></td></tr>`).join("");
    return `${comTitulo ? `<h2>Plano de ação</h2>` : ""}<p>${n ? `${n} ${n === 1 ? "ponto" : "pontos"} a tratar. Responsável e prazo vêm do plano de ação; os que estão em branco ainda precisam ser definidos com a empresa.` : ""}</p>
      ${n ? `<table><thead><tr><th>Nº</th><th>Área</th><th>O que fazer</th><th>Ação</th><th>Registrado</th><th>Situação</th><th>Responsável</th><th>Prazo</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="vz">Nenhuma pendência em aberto nas áreas escolhidas.</p>`}`;
  };

  let body = "";
  if (r.tipo === "completo"){
    body = cover() + `<div class="pb"></div>` + resumo() + parecer()
      + areas.map((a, i) => { const s = scoreOf(a.id); return `<div class="pb"></div><h2>${esc(a.nome)}${s.pct != null ? ` <span class="sc ${lv(s.pct)}">${s.pct}% de adequação</span>` : ""}</h2>${MODELOS[a.id] ? `<p style="color:#5F6A66">${esc(MODELOS[a.id].desc)}</p>` : ""}${dadosArea(a)}${checkArea(a)}${a.id === "rh" ? funcArea() : ""}${obsArea(a)}`; }).join("")
      + docsSec() + `<div class="pb"></div>` + swotSec() + `<div class="pb"></div>` + planoSec(true);
  } else if (r.tipo === "periodo"){
    const resolvidasP = obs.filter(o => (o.tipo === "def" || o.tipo === "acao") && o.status === "resolvido" && (o.resolvidoEm || o.atualizado) && inP((o.resolvidoEm || o.atualizado).slice(0, 10)));
    const linhas = areas.map(a => { const l = obsP.filter(o => o.secao === a.id); return {a, def:l.filter(o => o.tipo === "def").length, pos:l.filter(o => o.tipo === "pos").length, acao:l.filter(o => o.tipo === "acao").length, nota:l.filter(o => o.tipo === "nota").length, res:resolvidasP.filter(o => o.secao === a.id).length}; });
    const tot = k => linhas.reduce((t, x) => t + x[k], 0);
    body = head() + `<h2>Resumo do período</h2>
      <div class="kpis"><div class="kpi"><b>${obsP.length}</b><span>anotações feitas</span></div><div class="kpi"><b>${tot("def")}</b><span>deficiências encontradas</span></div><div class="kpi"><b>${resolvidasP.length}</b><span>pendências resolvidas</span></div><div class="kpi"><b>${abertas}</b><span>ainda em aberto</span></div></div>

      + (() => { const m = ini && fim && ini.slice(0, 7) === fim.slice(0, 7) ? ini.slice(0, 7) : null, fx = itemsOf("fechamentos"); if (!m || !fx[m]) return ""; const fs2 = [fx[mesAnterior(m)], fx[m]].filter(Boolean); return `<h2>Evolução no mês</h2>` + evolucaoRel(fs2, true); })()
      + parecer()

      + (obsP.length ? "" : `<p class="vz">Nenhuma anotação no período escolhido.</p>`);
  } else if (r.tipo === "resultados"){

    body = head() + `<h2>Resultados das intervenções</h2>` + (lst.length ? `<table><thead><tr><th>Intervenção</th><th>Setor</th><th>Situação</th><th>Etapas</th><th>Resultado</th></tr></thead><tbody>${lst.map(resumoLinha).join("")}</tbody></table>` : "") + parecer() + resultadosRel(lst);
  } else if (r.tipo === "evolucao"){
    const fsP = fechamentos().filter(f => (!ini || ultimoDia(f.mes) >= ini) && (!fim || f.mes + "-01" <= fim));

  } else if (r.tipo === "plano"){
    body = head() + parecer() + planoSec(false);
  } else {
    body = head() + swotSec() + parecer();
  }
  return `<div class="rp" style="--rc:${esc(cor)}">${body}<div class="note">${esc(gvNome)} · relatório de ${esc(c.nome)} · ${hojeF}</div></div>`;

  if (tp){ const sec = $("#cmp").dataset.sec; ui.tipo[sec] = tp.dataset.tipo; document.querySelectorAll("[data-tipo]").forEach(b => b.setAttribute("aria-pressed", b === tp)); return; }
  const fl = e.target.closest("[data-filtro]");
  if (fl){ ui.filtro[$("#cmp").dataset.sec] = fl.dataset.filtro; render(); return; }
  const rt = e.target.closest("[data-rtipo]");
  if (rt){ ui.rel.tipo = rt.dataset.rtipo; document.querySelectorAll("[data-rtipo]").forEach(x => x.setAttribute("aria-pressed", x === rt)); refreshPrev(); return; }
  const ra = e.target.closest("[data-rarea]");
  if (ra){ const all = cfg().abas.map(a => a.id); let cur = ui.rel.areas || all.slice(); const id = ra.dataset.rarea; cur = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id); if (!cur.length){ toast("Escolha pelo menos uma área."); return; } ui.rel.areas = cur.length === all.length ? null : all.filter(x => cur.includes(x)); ra.setAttribute("aria-pressed", cur.includes(id)); refreshPrev(); return; }
  const pf = e.target.closest("[data-planof]");
  if (pf){ ui.planoF = pf.dataset.planof; V = "plano"; render(); return; }
  const ib = e.target.closest("[data-int]");

  const ifx = e.target.closest("[data-intf]");
  if (ifx){ ui.intF = ifx.dataset.intf; render(); return; }
  const pra = e.target.closest("[data-pria]");
  if (pra){ ui.priArea = pra.dataset.pria; render(); return; }
  const gb = e.target.closest("[data-graf]");

  const gpl = e.target.closest("[data-gpl]");
  if (gpl){ ui.gPer = +gpl.dataset.gpl; render(); return; }
  const im = e.target.closest("[data-imodo]");
  if (im){ ui.indModo = im.dataset.imodo; render(); return; }
  const hb = e.target.closest("[data-hist]");
  if (hb){ ui.histAberto[hb.dataset.hist] = !ui.histAberto[hb.dataset.hist]; const i = indicadores().find(x => x.id === hb.dataset.hist); if (i) atualizarCard(i); return; }
  const dl = e.target.closest("[data-dellanc]");
  if (dl){ apagarLanc(dl.dataset.dellanc); return; }
  const dfx = e.target.closest("[data-docf]");
  if (dfx){ ui.docFiltro = dfx.dataset.docf; render(); return; }
  const di = e.target.closest("[data-doc]");
  if (di){ ui.docSel = di.dataset.doc; render(); return; }
  const sb = e.target.closest("[data-sub]");
  if (sb){ ui.sub[V] = sb.dataset.sub; ui.editing = null; render(); return; }
  const sg = e.target.closest(".seg [data-ck]");
  if (sg){ const k = sg.dataset.ck, v = sg.dataset.v; setDiag(V, d => { const c = Object.assign({}, d.check[k]); c.r = c.r === v ? "" : v; d.check[k] = c; }); return; }
  const tr = e.target.closest("[data-func]");
  if (tr){ dlgFunc(tr.dataset.func); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.act){
    case "addObs": addObs(); break;
    case "quickAdd": addQuick(); break;
    case "docEdit": dlgDocEdit(id); break;
    case "achAdd": addAchadoDoc(id); break;
    case "docDel": { const d = docById(id); if (d && await askConfirm("Excluir documento", `Excluir ${d.nome}? O arquivo vai para a lixeira do Drive. As anotações já registradas no diário continuam.`, "Excluir")){ delete B["doc_" + id]; writeKey("doc_" + id); ui.docSel = null; toast("Documento excluído."); } break; }
    case "ckAdd": ckAdd(); break;
    case "ckDel": { const k = b.dataset.ck, it = (diagOf(V).extras || {})[k]; if (it && await askConfirm("Remover item", it.l, "Remover")) setDiag(V, d => { delete d.extras[k]; delete d.check[k]; }); break; }
    case "ckDef": { const k = b.dataset.ck, it = checkItems(V).find(i => i.k === k); if (!it) return; const c = diagOf(V).check[k] || {};
      const o = {secao:V, data:hoje(), texto:it.l + (c.r === "parcial" ? " (atende só em parte)" : " (não atende)") + (c.nota ? ". " + c.nota : ""), tipo:"def", status:"pendente", origem:"checklist", criado:new Date().toISOString(), autor:USER.email};
      const oid = uid(); putItem(obsKey(o), oid, o); setDiag(V, d => { d.check[k] = Object.assign({}, d.check[k], {obs:oid}); }); toast("Deficiência registrada no diário."); break; }
    case "status": { const o = findObs(id); if (o) updObs(id, {status:STATUS_NEXT[o.status || "pendente"]}); break; }
    case "edit": ui.editing = id; render(); setTimeout(() => { const t = $("#editTxt"); if (t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 0); break;
    case "cancelEdit": ui.editing = null; render(); break;
    case "saveEdit": { const t = $("#editTxt").value.trim(); if (!t){ toast("A anotação não pode ficar vazia."); return; } const tipo = $("#editTipo").value; const patch = {texto:t, tipo, data:$("#editData").value || hoje()}; if (tipo !== "def" && tipo !== "acao") patch.status = null; ui.editing = null; updObs(id, patch); toast("Anotação atualizada."); break; }
    case "delObs": { const o = findObs(id); if (o && await askConfirm("Apagar anotação", `"${o.texto.slice(0, 90)}${o.texto.length > 90 ? "…" : ""}"`, "Apagar")){ delItem(o._k, id); toast("Anotação apagada."); } break; }
    case "toSwot": { const o = findObs(id); if (!o) return; putItem("swot", uid(), {quad:b.dataset.q, texto:o.texto, origem:o.id, area:o.secao, criado:new Date().toISOString()}); toast(`Enviado para ${QUADS[b.dataset.q].nome}.`); break; }
    case "soPend": { const sec = $("#cmp").dataset.sec; ui.sopend[sec] = !ui.sopend[sec]; render(); break; }
    case "novoFunc": dlgFunc(null); break;
    case "novaAba": dlgNovaAba(); break;
    case "config": dlgGV(); break;
    case "clientes": fecharCliente(); break;
    case "sair": sair(); break;
    case "trocarSrv": ui.trocarSrv = true; render(); break;
    case "tentarDeNovo": ESTADO.erro = null; ESTADO.carregando = true; render(); initStore().then(() => { applyBrand(); render(); }); break;
    case "docBaixar": baixarDocArquivo(id); break;
    case "soMeus": ui.soMeus = !ui.soMeus; render(); break;
    case "novoCliente": dlgCliente(null); break;
    case "dadosCliente": dlgCliente(CUR); break;
    case "relatorio": V = "relatorios"; render(); break;
    case "relPDF": baixarPDF(); break;
    case "relDrive": baixarPDF("drive"); break;
    case "fecharMes": dlgFechar(); break;
    case "boletim": dlgBoletim(); break;
    case "gerInd": dlgGerInd(); break;
    case "novoInd": dlgIndicador(null, b.dataset.area); break;
    case "regHoje": ui.dataReg = null; render(); break;
    case "intervir": dlgIntervencao(null, id); break;
    case "novaInt": dlgIntervencao(null); break;
    case "editInt": dlgIntervencao(id); break;
    case "intLista": ui.intSel = null; render(); break;
    case "intIniciar": setInt(id, {status:"andamento", inicio:(itemsOf("intervencoes")[id] || {}).inicio || hoje()}); toast("Intervenção iniciada."); break;
    case "intConcluir": concluirInt(id); break;
    case "intReabrir": setInt(id, {status:"andamento", concluida_em:""}); toast("Intervenção reaberta."); break;
    case "addEtapa": addEtapa(id); break;
    case "delInt": { const it = itemsOf("intervencoes")[id]; if (it && await askConfirm("Excluir intervenção", `Excluir "${it.titulo}"? As etapas continuam no plano de ação como ações comuns.`, "Excluir")){ delItem("intervencoes", id); ui.intSel = null; toast("Intervenção excluída."); } break; }
    case "sugInd": usarSugestoes(); break;
    case "plano": dlgPlano(id); break;
    case "delFech": { const mes = b.dataset.mes; if (await askConfirm("Excluir fechamento", `Excluir o fechamento de ${mesNome(mes)}? As anotações e o checklist atuais não mudam.`, "Excluir")){ delItem("fechamentos", mes); toast("Fechamento excluído."); } break; }
    case "relHTML": baixarRelHTML(); break;
    case "swAdd": { const inp = document.querySelector(`[data-qin="${b.dataset.q}"]`); swAdd(b.dataset.q, inp); break; }
    case "swEditar": ui.editing = id; render(); setTimeout(() => $("#swEdit") && $("#swEdit").focus(), 0); break;
    case "swSave": { const v = $("#swEdit").value.trim(); if (!v) return; const it = itemsOf("swot")[id]; ui.editing = null; putItem("swot", id, Object.assign({}, it, {texto:v})); break; }
    case "swDel": { const it = itemsOf("swot")[id]; if (it && await askConfirm("Apagar item", it.texto.slice(0, 120), "Apagar")) delItem("swot", id); break; }
  }
});
function ckAdd(){ const inp = $("#ckNovo"), v = inp && inp.value.trim(); if (!v){ inp && inp.focus(); return; } inp.value = ""; setDiag(V, d => { d.extras[uid()] = {l:v, criado:new Date().toISOString()}; }); setTimeout(() => { const n = $("#ckNovo"); n && n.focus(); }, 0); }
function swAdd(q, inp){ const v = inp && inp.value.trim(); if (!v){ inp && inp.focus(); return; } inp.value = ""; putItem("swot", uid(), {quad:q, texto:v, criado:new Date().toISOString()}); setTimeout(() => { const n = document.querySelector(`[data-qin="${q}"]`); n && n.focus(); }, 0); }
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset && t.dataset.ind){ lancar(t); return; }
  if (t.dataset && t.dataset.gut){ const o = findObs(t.dataset.gut); if (o){ const g = Object.assign({}, o.gut || {}); g[t.dataset.k] = t.value ? +t.value : null; updObs(o.id, {gut:g}); } return; }
  if (t.id === "intRes"){ const id = t.dataset.id, x = itemsOf("intervencoes")[id]; if (x){ B.intervencoes.items = Object.assign({}, B.intervencoes.items, {[id]: Object.assign({}, x, {resultado:t.value.trim()})}); writeItem(CUR, "intervencoes", id, true); } return; }
  if (t.id === "dataReg"){ ui.dataReg = t.value && t.value <= hoje() ? t.value : null; render(); return; }
  if (t.id === "qcArea"){ ui.qcArea = t.value; const q = $("#qcTxt"); if (q){ q.focus(); } }
  if (t.id === "relPer"){ ui.rel.per = t.value; render(); return; }
  if (t.id === "relDe" || t.id === "relAte"){ ui.rel[t.id === "relDe" ? "de" : "ate"] = t.value; refreshPrev(); }
  if (t.id === "relCons"){ B.relatorio = Object.assign({}, B.relatorio || {}, {consultor:t.value.trim()}); writeKey("relatorio", true); refreshPrev(); }
  if (t.id === "docNotas"){ salvarDoc(t.dataset.id, {notas:t.value}, true); }
  if (t.id === "parecer" && !t.readOnly){ salvarParecer(t.value); refreshPrev(); }
  if (t.dataset && t.dataset.diag && t.dataset.df){
    const f = (MODELOS[t.dataset.diag] || {campos:[]}).campos.find(x => x.k === t.dataset.df); if (!f) return;
    let v = t.value;
    if (f.t === "money"){ v = parseMoney(v); t.value = fmtMoneyIn(v); }
    else if (f.t === "num") v = v === "" ? null : Math.max(0, +v);
    else v = v.trim ? (f.t === "area" ? v : v.trim()) : v;
    setDiag(t.dataset.diag, d => { d.dados[f.k] = v; }, true);
    const c = $("#calc"); if (c) c.innerHTML = calcHTML(t.dataset.diag);
  }
  if (t.dataset && t.dataset.diag && t.dataset.cn){ const k = t.dataset.cn, v = t.value.trim(); setDiag(t.dataset.diag, d => { d.check[k] = Object.assign({}, d.check[k], {nota:v}); }, true); }
});
document.addEventListener("input", e => {
  if (e.target.id === "cmp") ui.draft[e.target.dataset.sec] = e.target.value;
  if (e.target.id === "qcTxt") ui.qcDraft = e.target.value;
  if (e.target.id === "cmpData") ui.dataEntrada[$("#cmp").dataset.sec] = e.target.value;
  if (e.target.id === "cliBusca"){ ui.cliBusca = e.target.value; const pos = e.target.selectionStart; render(); const s2 = $("#cliBusca"); s2.focus(); try { s2.setSelectionRange(pos, pos); } catch(x){} }
  if (e.target.id === "busca"){ const sec = $("#cmp").dataset.sec; ui.busca[sec] = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#busca"); s.focus(); try { s.setSelectionRange(pos, pos); } catch(x){} }
});
document.addEventListener("keydown", e => {
  if (e.target.id === "cmp" && e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); addObs(); }
  if (e.target.id === "qcTxt" && e.key === "Enter"){ e.preventDefault(); addQuick(); }
  if (e.target.id === "ckNovo" && e.key === "Enter"){ e.preventDefault(); ckAdd(); }
  if (e.target.dataset && e.target.dataset.ind && e.key === "Enter"){ e.preventDefault(); const l = [...document.querySelectorAll("[data-ind]")], i = l.indexOf(e.target); if (l[i + 1]) l[i + 1].focus(); else e.target.blur(); }
  if (e.target.closest && e.target.closest(".etnova") && e.target.tagName === "INPUT" && e.key === "Enter"){ e.preventDefault(); addEtapa(e.target.closest(".etnova").querySelector("[data-act=addEtapa]").dataset.id); }
  if (e.target.id === "achTxt" && e.key === "Enter"){ e.preventDefault(); addAchadoDoc(ui.docSel); }
  if (e.target.classList && e.target.classList.contains("ck-n") && e.key === "Enter"){ e.preventDefault(); e.target.blur(); }
  if (e.target.matches && e.target.matches("[data-qin]") && e.key === "Enter"){ e.preventDefault(); swAdd(e.target.dataset.qin, e.target); }
  if (e.target.id === "swEdit" && e.key === "Enter"){ e.preventDefault(); document.querySelector('[data-act="swSave"]').click(); }
  if (e.target.id === "swEdit" && e.key === "Escape"){ ui.editing = null; render(); }
  if (e.target.matches && e.target.matches("[data-func]") && e.key === "Enter") dlgFunc(e.target.dataset.func);
});

$("#fileDoc").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !CUR) return;
  dlgDoc(f);
};
document.addEventListener("dragover", e => { const z = e.target.closest && e.target.closest("#dropz"); if (z){ e.preventDefault(); z.classList.add("over"); } });
document.addEventListener("dragleave", e => { const z = e.target.closest && e.target.closest("#dropz"); if (z) z.classList.remove("over"); });
document.addEventListener("drop", e => { const z = e.target.closest && e.target.closest("#dropz"); if (!z) return; e.preventDefault(); z.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) dlgDoc(f); });

/* tema */
let theme = null; try { theme = localStorage.getItem("dmconsult.tema"); } catch(e){}
function applyTheme(){
  if (theme) document.documentElement.setAttribute("data-theme", theme); else document.documentElement.removeAttribute("data-theme");
  const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeBtn").textContent = dark ? "Tema claro" : "Tema escuro";
}
$("#themeBtn").onclick = () => { const dark = theme ? theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; theme = dark ? "light" : "dark"; try { localStorage.setItem("dmconsult.tema", theme); } catch(e){} applyTheme(); };

{ const st = document.createElement("style"); st.textContent = REL_CSS; document.head.appendChild(st); }
